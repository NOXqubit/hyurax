# Testes automáticos a cada envio e a cada pedido de mudança.
#
# Roda as duas pontas do contrato: o gabarito Python (que também regera os
# vetores e confere que nada mudou) e o nó Rust (testes e clippy). Um vetor que
# não bate derruba o build: é assim que uma mudança de consenso não passa
# despercebida.

name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: gabarito Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python reference/tests/run_all_tests.py

  rust:
    name: nó Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # versão fixa: lint novo de uma versão nova não derruba o lançamento
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Regra do projeto: nenhuma dependência com código em C.
      - name: sem compilador C na árvore de dependências
        run: |
          if cargo tree -i cc --workspace 2>/dev/null | grep -q cc; then
            echo "uma dependência passou a exigir compilador C"; exit 1
          fi

  rede:
    name: cenários de rede (ataques e auto-reanimação)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v5
      # versão fixa: lint novo de uma versão nova não derruba o lançamento
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo test -p hyurax-net --locked -- --ignored --test-threads=1
      # três núcleos completos ligados pelos sockets: JOB de nível 3 e um nó
      # que cai no meio
      - run: cargo test -p hyurax-nucleo --test tres_nos --locked -- --ignored
      # o agente do programa (núcleo completo) contra o servidor da plataforma V1
      - run: cargo test -p hyurax-plataforma --test agente_real --locked -- --ignored

  fuzzing:
    name: fuzzing dos decodificadores e dos motores
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v5
      # versão fixa: lint novo de uma versão nova não derruba o lançamento
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      # semente nova a cada execução: cada envio explora mutações diferentes.
      # A semente sai no log; para reproduzir uma falha, rode com a mesma
      # (HYX_FUZZ_SEMENTE=N cargo test -p hyurax-nucleo --test fuzz)
      - run: cargo test -p hyurax-nucleo --test fuzz --locked -- --nocapture --test-threads=1
        env:
          HYX_FUZZ: "100000"
          HYX_FUZZ_SEMENTE: ${{ github.run_number }}

  dependencias:
    name: falhas conhecidas nas dependências (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # versão fixa: lint novo de uma versão nova não derruba o lançamento
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      # binário pronto do cargo-audit; roda só no GitHub, nada é instalado aqui
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # falha com vulnerabilidade publicada no RustSec para qualquer versão do
      # Cargo.lock; avisos (crate sem manutenção) aparecem no log sem derrubar
      - run: cargo audit
