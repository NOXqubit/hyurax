# Programas prontos para baixar, montados pelo próprio GitHub.
#
# Roda quando uma etiqueta `v*` é enviada (ou à mão, em Actions). Testa,
# compila o `hyurax-no` (terminal) para cada sistema, monta o programa com
# janela e o instalador para Windows, testa a instalação limpa, e publica os
# pacotes numa Release com a soma SHA-256 de cada arquivo.
#
# Hyurax / Ultrax 1.0: o programa é a versão oficial; a rede é de TESTE.
#
# O código é Rust puro (sem compilador C), então a compilação cruzada para o
# ARM de celular não precisa de nada além do linker do alvo.

name: lancamento

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    name: testes antes de empacotar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # versão fixa: lint novo de uma versão nova não derruba o lançamento
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo test --workspace --locked
      - run: cargo test -p hyurax-net --locked -- --ignored --test-threads=1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  compilar:
    name: ${{ matrix.nome }}
    needs: testes
    runs-on: ${{ matrix.maquina }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: linux-x86_64
            maquina: ubuntu-latest
            alvo: x86_64-unknown-linux-musl
          - nome: linux-arm64-e-celular
            maquina: ubuntu-latest
            alvo: aarch64-unknown-linux-musl
          - nome: windows-x86_64
            maquina: windows-latest
            alvo: x86_64-pc-windows-msvc
          - nome: macos-arm64
            maquina: macos-latest
            alvo: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      # versão fixa: lint novo de uma versão nova não derruba o lançamento
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.alvo }}
      - name: linker do alvo (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.alvo }}
      - name: compilar
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.alvo }} -p hyurax-no
      - name: empacotar
        shell: bash
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME}"
          pasta="hyurax-${versao}-${{ matrix.nome }}"
          mkdir -p "$pasta"
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp ".target/${{ matrix.alvo }}/release/hyurax-no${ext}" "$pasta/"
          cp LICENSE-MIT LICENSE-APACHE "$pasta/"
          cp docs/RODAR-UM-NO.md "$pasta/LEIA-ME.md"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${pasta}.zip" "$pasta" > /dev/null
            arquivo="${pasta}.zip"
          else
            tar czf "${pasta}.tar.gz" "$pasta"
            arquivo="${pasta}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$arquivo" > "${arquivo}.sha256"; else shasum -a 256 "$arquivo" > "${arquivo}.sha256"; fi
          echo "ARQUIVO=$arquivo" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: |
            ${{ env.ARQUIVO }}
            ${{ env.ARQUIVO }}.sha256

  # O programa com janela e o instalador, montados pelo mesmo roteiro que
  # roda numa máquina Windows (scripts/empacotar-windows.ps1): --locked,
  # caminhos trocados por nomes fixos e ligador sem carimbo de hora.
  programa-windows:
    name: programa e instalador (Windows)
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # versão fixa: lint novo de uma versão nova não derruba o lançamento
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: montar
        shell: pwsh
        run: ./scripts/empacotar-windows.ps1
      - name: instalar, abrir e desinstalar numa pasta isolada
        shell: pwsh
        run: ./scripts/testar-instalacao.ps1 -Instalador dist/hyurax-instalador-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: programa-windows-x86_64
          path: |
            dist/hyurax-windows-x86_64.zip
            dist/hyurax-windows-x86_64.zip.sha256
            dist/hyurax-instalador-windows-x86_64.exe
            dist/hyurax-instalador-windows-x86_64.exe.sha256

  publicar:
    name: publicar a Release
    # Espera os dois: sem o programa na Release, o link fixo do site quebra.
    needs: [compilar, programa-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Não é pré-lançamento de propósito: o link do site usa
          # releases/latest, e o GitHub pula pré-lançamentos nesse endereço.
          # Quem avisa que é rede de teste é o texto abaixo e o LEIA-ME.
          prerelease: false
          make_latest: true
          files: pacotes/*
          body: |
            **Hyurax / Ultrax 1.0 — rede de TESTE.** O programa é a versão 1.0; a rede é de teste e o HYX não tem valor.
            Não há venda, pré-venda nem promessa de lucro. O Work Score e os créditos de computação não são dinheiro nem HYX.

            Notas desta versão: [docs/NOTAS-1.0.md](https://github.com/NOXqubit/hyurax/blob/main/docs/NOTAS-1.0.md).

            Ao instalar ou abrir o programa pela primeira vez, você lê e aceita os [termos de uso](https://github.com/NOXqubit/hyurax/blob/main/docs/TERMOS-DE-USO.md): software experimental, sem garantia, e cada pessoa responde pelo uso que faz.

            Como usar: o programa com janela traz um `LEIA-ME.txt`; os pacotes de terminal trazem o `LEIA-ME.md` (é o `docs/RODAR-UM-NO.md`). Instalar a 1.0 por cima de uma versão anterior atualiza o programa sem tocar na carteira.

            | Pacote | Para |
            |---|---|
            | `hyurax-instalador-windows-x86_64.exe` | **Instalador** do programa com janela, para Windows 10 e 11 (sem administrador) |
            | `hyurax-windows-x86_64.zip` | O mesmo programa, sem instalar: descompacte e abra o `Hyurax.exe` |
            | `linux-x86_64` | PC com Linux |
            | `linux-arm64-e-celular` | Linux em ARM e celular Android pelo Termux |
            | `windows-x86_64` | Windows 10 ou 11 |
            | `macos-arm64` | Mac com chip Apple |

            Confira a soma SHA-256 de cada pacote antes de rodar.
