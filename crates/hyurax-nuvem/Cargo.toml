[package]
name = "hyurax-nuvem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Hyurax — nuvem entre os nós: mercado de máquinas, armazenamento distribuído (Reed–Solomon) e livro de contas"

[dependencies]
hyurax-identidade.workspace = true
hyurax-crypto.workspace = true
hyurax-codec.workspace = true

[dev-dependencies]
