[package]
name = "hyurax-pow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Hyurax — prova de trabalho Argon2id"

[dependencies]
hyurax-identidade.workspace = true
argon2.workspace = true

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# As mesmas regras dos outros crates: código de consenso não derruba o nó por
# causa de um `unwrap` esquecido.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
