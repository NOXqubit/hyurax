[package]
name = "auron-pow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Auron — prova de trabalho Argon2id e minerador que roda no celular"

[dependencies]
argon2.workspace = true
# só o programa auron-minerar usa, para medir o trabalho útil no aparelho
auron-usefulpow.workspace = true

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true

[[bin]]
name = "auron-minerar"
path = "src/bin/auron-minerar.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# As mesmas regras dos outros crates: código de consenso não derruba o nó por
# causa de um `unwrap` esquecido.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
