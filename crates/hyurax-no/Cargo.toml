[package]
name = "hyurax-no"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Hyurax / Ultrax — o programa de terminal: nó, carteira, mineração, ULTRAX e JOBs científicos"

[[bin]]
name = "hyurax-no"
path = "src/main.rs"

[dependencies]
hyurax-nucleo.workspace = true
hyurax-interface.workspace = true
hyurax-crypto.workspace = true
hyurax-nuvem.workspace = true
hyurax-consensus.workspace = true
hyurax-chain.workspace = true
hyurax-net.workspace = true
hyurax-pow.workspace = true
hyurax-block.workspace = true
hyurax-tx.workspace = true
hyurax-ultrax.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
