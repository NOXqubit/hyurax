[package]
name = "auron-chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Auron — a cadeia: gênese, validação completa, entrada única, rollback e mineração"

[dependencies]
auron-crypto.workspace = true
auron-codec.workspace = true
auron-tx.workspace = true
auron-usefulpow.workspace = true
auron-pow.workspace = true
auron-block.workspace = true
auron-consensus.workspace = true
auron-state.workspace = true

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
