[package]
name = "hyurax-instalador"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Hyurax / Ultrax — o instalador para Windows (leva o programa dentro)"

[[bin]]
name = "hyurax-instalador"
path = "src/main.rs"

[dependencies]
hyurax-nucleo.workspace = true

[target.'cfg(windows)'.dependencies]
wry = { version = "=0.48.1", default-features = false, features = ["os-webview"] }
tao = { version = "=0.31.1", default-features = false, features = ["rwh_06"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
