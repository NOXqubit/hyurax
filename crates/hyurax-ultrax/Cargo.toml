[package]
name = "hyurax-ultrax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Hyurax — ULTRAX, motor de trabalho útil: tarefas, execução, verificação, reputação e Work Score"

[dependencies]
hyurax-identidade.workspace = true
hyurax-crypto.workspace = true
hyurax-codec.workspace = true
# o gerador de matrizes é o mesmo do trabalho útil do consenso
hyurax-usefulpow.workspace = true

[dev-dependencies]
