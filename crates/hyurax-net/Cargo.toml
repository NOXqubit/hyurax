[package]
name = "hyurax-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Hyurax — transporte da rede entre nós: conexões TCP cifradas (Noise XX), aperto de mão, sincronização e mempool"

[dependencies]
hyurax-identidade.workspace = true
hyurax-wire.workspace = true
hyurax-block.workspace = true
hyurax-tx.workspace = true
hyurax-chain.workspace = true
hyurax-consensus.workspace = true
hyurax-crypto.workspace = true
