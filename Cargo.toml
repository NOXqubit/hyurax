[workspace]
resolver = "3"
members = ["crates/auron-types", "crates/auron-crypto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Projeto Auron"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/"
description = "Auron — implementação de nó em Rust"

# ---------------------------------------------------------------------------
# REGRA DO PROJETO: só dependência Rust pura.
#
# A máquina de desenvolvimento não tem compilador C e não cabe um: o Visual
# Studio Build Tools pede de 3 a 4 GB no C:, que tem 5,7 GB livres. Em vez de
# forçar, o projeto escolhe dependências que não precisam de C.
#
# Isso não é limitação de máquina fraca. É o que vai permitir compilar o mesmo
# código no Termux do celular e num PC Linux velho sem preparar toolchain em
# lugar nenhum.
#
# Na prática: nada de `ring` nem `aws-lc-rs`. Quando chegarmos no P2P, isso
# significa TCP + Noise + Yamux, sem QUIC e sem rustls, porque os dois puxam
# `ring`.
#
# Antes de adicionar qualquer crate, conferir se ela tem `build.rs` chamando
# `cc`. Se tiver, procurar outra.
# ---------------------------------------------------------------------------

[workspace.dependencies]
# Vetores de teste. Rust puro.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Criptografia. As duas são Rust puro, e isso foi conferido com `cargo tree`
# em vez de presumido: no fecho transitivo não há `cc`, `ring`, `aws-lc`,
# `cmake` nem `sha2-asm`. O curve25519-dalek, que vem pelo ed25519-dalek, tem
# `build.rs`, mas ele só escolhe o backend em Rust com `cargo:rustc-cfg`; não
# compila nada nativo.
sha2 = { version = "0.11", default-features = false }

# Versão exata de propósito. Uma versão nova que mude o que a verificação de
# assinatura aceita é mudança de consenso, e mudança de consenso não entra por
# `cargo update`.
#
# As features ficam explícitas pelo mesmo motivo. `batch` e
# `legacy_compatibility` mudam o conjunto de assinaturas aceitas e NUNCA podem
# ser ligadas: a primeira aceita R não-canônico, a segunda aceita S >= L.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
debug = 0
lto = false
codegen-units = 16
