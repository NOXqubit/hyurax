<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>teste dos idiomas</title>
<style>
  body { font: 15px/1.5 ui-monospace, Consolas, monospace; background: #05070a; color: #eceae4; padding: 2rem; }
  .ok { color: #86d7a6; } .ruim { color: #f39188; }
</style>
</head>
<body>
<h1>Os quatro idiomas têm as mesmas chaves?</h1>
<pre id="saida">conferindo…</pre>
<script type="module">
// Achata cada dicionário em "a.b.c" (listas contam pelo tamanho) e compara com o
// português, que é a referência. Abra com: python site/tools/servidor_dev.py
const achatar = (o, p = "") => Object.entries(o).flatMap(([k, v]) =>
  (v && typeof v === "object" && !Array.isArray(v)) ? achatar(v, p + k + ".")
    : [p + k + (Array.isArray(v) ? `[${v.length}]` : "")]);
const saida = document.getElementById("saida");
const base = new Set(achatar((await import("../locales/pt-BR.js")).default));
const linhas = [`pt-BR: ${base.size} chaves (referência)`];
let tudoCerto = true;
for (const codigo of ["en", "es", "ja"]) {
  const chaves = new Set(achatar((await import(`../locales/${codigo}.js`)).default));
  const faltam = [...base].filter((x) => !chaves.has(x));
  const sobram = [...chaves].filter((x) => !base.has(x));
  if (faltam.length || sobram.length) tudoCerto = false;
  linhas.push(`${codigo}: ${faltam.length ? "faltam " + faltam.join(", ") : "nada falta"}; ${sobram.length ? "sobram " + sobram.join(", ") : "nada sobra"}`);
}
linhas.push("", tudoCerto ? "TUDO CERTO" : "HÁ DIFERENÇAS");
saida.textContent = linhas.join("\n");
saida.className = tudoCerto ? "ok" : "ruim";
</script>
</body>
</html>
